<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Пожелания · для Лёши</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head>
<body><main><a href="/" class="back" data-copy="назад">← На наш сайт</a><p class="eyebrow" data-copy="надзаголовок">ТОЛЬКО ДЛЯ ЛЁШИ</p><h1 data-copy="заголовок">Наше «когда-нибудь» ♡</h1><p id="status" role="status" aria-live="polite"></p>
